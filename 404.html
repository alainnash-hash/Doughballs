<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · DoughBalls Pizza</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#004F59">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;800&family=Titan+One&family=Yellowtail&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#C6AA76;color:#0b2a2e;font-family:Barlow,system-ui,sans-serif;padding:24px;text-align:center}
  main{display:flex;flex-direction:column;align-items:center;gap:22px;max-width:620px}
  img{width:120px;height:120px;filter:drop-shadow(0 6px 14px rgba(0,40,46,.28))}
  .kicker{font-family:Yellowtail,cursive;font-size:34px;line-height:1;color:#004F59}
  h1{margin:0;font-family:'Titan One',sans-serif;font-weight:400;font-size:clamp(44px,9vw,96px);line-height:.95;color:#004F59;text-transform:uppercase;text-shadow:4px 4px 0 #f4ede0}
  p{margin:0;font-size:19px;line-height:1.6}
  a.btn{display:inline-flex;align-items:center;gap:12px;padding:8px 8px 8px 26px;border-radius:999px;background:#004F59;color:#fff;font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
  a.btn span{width:44px;height:44px;border-radius:50%;background:#f4ede0;color:#004F59;display:flex;align-items:center;justify-content:center}
  a.btn:focus-visible{outline:3px solid #f4ede0;outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/assets/logo-primary.png" alt="DoughBalls Pizza">
  <span class="kicker">Well, this is awkward</span>
  <h1>Page not<br>found</h1>
  <p>That page has gone the way of the last slice. Let's get you back to the good stuff.</p>
  <a class="btn" href="/">Back to home<span aria-hidden="true">→</span></a>
</main>
</body>
</html>
