<x-dc>
<helmet>

<title>Locations · DoughBalls Pizza</title>
<style>body{margin:0;background:#f4ede0;font-family:Barlow,system-ui,sans-serif;color:#0b2a2e;-webkit-font-smoothing:antialiased}a{color:#004F59;text-decoration:none}a:hover{color:#C6AA76}*{box-sizing:border-box}html,body{overflow-x:clip}button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:inherit;cursor:pointer}:focus-visible{outline:3px solid #C6AA76;outline-offset:3px}@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;scroll-behavior:auto!important}}</style>
</helmet>
<dc-import name="SiteHeader" page="Locations" hint-size="100%,0px"></dc-import>

<dc-import name="PageHero" img="/assets/img/Hero-Pic-1.webp" alt="Inside DoughBalls" caption="Glenelg · City · Taperoo" t1="Find your" t2="pizza place" hint-size="100%,100vh"></dc-import>
<div style="position:relative;z-index:2">
<section style="pointer-events:none">
  <svg viewBox="0 0 1440 360" preserveAspectRatio="none" style="display:block;width:100%;height:clamp(140px,22vw,320px);margin-bottom:-1px"><path d="M0 360 V300 C0 262 46 240 140 238 H170 C182 160 246 118 370 116 H520 C590 114 616 30 720 28 C824 30 850 114 920 116 H1070 C1194 118 1258 160 1270 238 H1300 C1394 240 1440 262 1440 300 V360 Z" fill="#C6AA76"></path></svg>
  <div style="background:#C6AA76;display:flex;flex-direction:column;align-items:center;text-align:center;gap:26px;padding:0 24px 150px;pointer-events:auto">
    <span data-reveal="1" style="margin-top:clamp(-130px,-6.5vw,-36px);padding:8px 18px;border-radius:10px;background:#f4ede0;color:#004F59;font-family:Yellowtail,cursive;font-size:30px;line-height:1;transform:rotate(-3deg)">Pick a restaurant</span><h2 data-reveal="1" style="margin:0;font-family:'Titan One',sans-serif;font-weight:400;font-size:clamp(44px,7vw,112px);line-height:.95;color:#004F59;text-transform:uppercase;text-shadow:4px 4px 0 #f4ede0">Pull up<br>a chair</h2><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><sc-for list="{{ locs }}" as="l" hint-placeholder-count="4"><button type="button" onClick="{{ l.pick }}" style="padding:12px 20px;border-radius:999px;border:2px solid #004F59;background:{{ l.tabBg }};color:{{ l.tabFg }};font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:background .2s">{{ l.short }}</button></sc-for></div>
  </div>
</section>
<div style="position:relative;z-index:2;background:#f4ede0;border-radius:48px 48px 0 0;margin-top:-48px;box-shadow:0 -22px 44px rgba(0,40,46,.32)">
<section ref="{{ detailRef }}" style="max-width:1360px;margin:0 auto;padding:clamp(56px,7vw,104px) clamp(16px,4vw,40px) 0">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:20px">
    <div style="position:relative;border-radius:36px;overflow:hidden;min-height:560px;background:#004F59">
      <sc-for list="{{ locs }}" as="l" hint-placeholder-count="1"><img loading="lazy" decoding="async" src="{{ l.img }}" alt="{{ l.name }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:{{ l.op }};transform:scale({{ l.sc }});transition:opacity .6s,transform 1.2s"></sc-for>
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,40,46,0) 45%,rgba(0,40,46,.85) 100%)"></div>
      <div style="position:absolute;left:32px;right:32px;bottom:30px;display:flex;flex-direction:column;gap:8px;color:#fff">
        <span style="font-family:Yellowtail,cursive;font-size:34px;line-height:1;color:#C6AA76">{{ a.tag }}</span>
        <span style="font-family:'Titan One',sans-serif;font-size:clamp(40px,4.5vw,68px);line-height:.92;text-transform:uppercase;text-shadow:4px 4px 0 #C6AA76">{{ a.name }}</span>
      </div>
    </div>
    <div style="background:#fff;border-radius:36px;padding:clamp(28px,4vw,48px);display:flex;flex-direction:column;gap:28px">
      <div style="display:flex;flex-direction:column;gap:6px"><span style="font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#C6AA76">Address</span><span style="font-size:20px;font-weight:600;line-height:1.45;color:#004F59">{{ a.address }}</span></div>
      <div style="display:flex;flex-direction:column;gap:6px"><span style="font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#C6AA76">Phone</span><a href="{{ a.tel }}" style="font-family:'Titan One',sans-serif;font-size:32px;line-height:1;color:#004F59">{{ a.phone }}</a></div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#C6AA76">Opening hours</span><span style="padding:6px 12px;border-radius:999px;background:{{ statusBg }};color:{{ statusFg }};font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase">{{ status }}</span></div>
        <div style="display:flex;flex-direction:column;border-top:1.5px solid #e6dccb">
          <sc-for list="{{ hours }}" as="h" hint-placeholder-count="4"><div style="display:flex;justify-content:space-between;gap:16px;padding:12px 14px;border-bottom:1.5px solid #e6dccb;background:{{ h.bg }};border-radius:{{ h.r }};font-size:16px;font-weight:{{ h.w }};color:#0b2a2e"><span>{{ h.d }}</span><span>{{ h.t }}</span></div></sc-for>
        </div>
      </div>
      <div style="margin-top:auto;display:flex;gap:8px;flex-wrap:wrap">
        <sc-if value="{{ a.bookable }}" hint-placeholder-val="{{ true }}"><a href="https://bookings.nowbookit.com/?accountid=5b90d805-2385-4034-910a-15808e7dfa1d&amp;theme=light&amp;colors=hex,004d40" target="_blank" style="padding:15px 24px;border-radius:999px;background:#C6AA76;color:#0b2a2e;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase">Book a table</a></sc-if>
        <sc-if value="{{ a.takeaway }}"><a href="https://www.meandu.app/doughballs-g/dine-in" target="_blank" style="padding:15px 24px;border-radius:999px;background:#004F59;color:#fff;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase">Order takeaway</a></sc-if>
        <a href="{{ a.dir }}" target="_blank" style="padding:15px 24px;border-radius:999px;border:2px solid #004F59;color:#004F59;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase" style-hover="background:#004F59;color:#fff">Directions ↗</a>

  </div>

<section style="max-width:1360px;margin:0 auto;padding:clamp(80px,10vw,150px) clamp(16px,4vw,40px) 0">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:20px">
    <sc-for list="{{ locs }}" as="l" hint-placeholder-count="4">
      <button type="button" onClick="{{ l.pickTop }}" style="background:{{ l.cardBg }};color:{{ l.cardFg }};border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:transform .3s,background .3s" style-hover="transform:translateY(-6px)">
        <span style="font-weight:800;font-size:14px;letter-spacing:.1em;color:#C6AA76">{{ l.num }}</span>
        <span style="font-family:'Titan One',sans-serif;font-size:28px;line-height:1;text-transform:uppercase">{{ l.name }}</span>
        <span style="font-size:15px;line-height:1.5;opacity:.85">{{ l.address }}</span>
        <span style="margin-top:8px;font-weight:800;font-size:15px">{{ l.phone }}</span>
      </button>
    </sc-for>
  </div>
</section>

<dc-import name="SiteFooter" hint-size="100%,1400px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const IMG = '/assets/img/';
const D = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const LOCS = [
  { short: 'Glenelg', tag: 'Beachside', name: 'Moseley Square', img: IMG + 'Carousel-Pic-7.webp', address: 'Shop 4, Moseley Square, Glenelg SA 5045', phone: '(08) 8376 9932', bookable: true, takeaway: true, hours: null, note: 'Open every day for lunch & dinner' },
  { short: 'Rundle Place', tag: 'City', name: 'Rundle Place', img: IMG + 'Carousel-Pic-2.webp', address: 'Rundle Place, Level 1, Dining Precinct, Adelaide SA 5000', phone: '(08) 8359 2740', bookable: true, takeaway: false, hours: ['11am – 9pm', '11am – 9pm', '11am – 9pm', '11am – 9pm', '11am – 10pm', '10am – 10pm', '10am – 9pm'] },
  { short: 'Taperoo', tag: 'Taperoo', name: 'Fort Largs Eatery', img: IMG + 'Carousel-Pic-1.webp', address: '5 Strathfield Terrace, Taperoo SA 5017', phone: '0499 777 454', bookable: true, takeaway: false, hours: ['Closed', 'Closed', '11:30am – 8pm', '11:30am – 8pm', '11:30am – 8:30pm', '11:30am – 8:30pm', '11:30am – 8pm'] },
  { short: 'Paxton Wines', tag: 'McLaren Vale pop-up', name: 'Paxton Wines', img: IMG + 'Pop-up-Catering-Pic-1.webp', address: 'Via Budgens Road, 68 Wheaton Road, McLaren Vale SA 5171', phone: '(08) 8376 9932', bookable: false, takeaway: false, hours: null, note: 'Pop-up · check our socials for dates' },
];
class Component extends DCLogic {
  state = { i: 0 };
  detailRef = React.createRef();
  renderVals() {
    const i = this.state.i, L = LOCS[i], today = (new Date().getDay() + 6) % 7;
    const hours = L.hours ? L.hours.map((t, k) => ({ d: D[k], t, bg: k === today ? '#f4ede0' : 'transparent', r: k === today ? '12px' : '0', w: k === today ? 800 : 500 })) : [{ d: 'Every day', t: L.note, bg: '#f4ede0', r: '12px', w: 700 }];
    const tToday = L.hours ? L.hours[today] : null;
    const status = !L.hours ? (L.bookable ? 'Open daily' : 'Pop-up') : tToday === 'Closed' ? 'Closed today' : 'Today ' + tToday;
    const q = encodeURIComponent(L.address);
    return {
      detailRef: this.detailRef,
      locs: LOCS.map((l, k) => ({ ...l, num: '0' + (k + 1), tabBg: k === i ? '#004F59' : 'transparent', tabFg: k === i ? '#fff' : '#004F59', op: k === i ? 1 : 0, sc: k === i ? 1 : 1.08, cardBg: k === i ? '#004F59' : '#fff', cardFg: k === i ? '#fff' : '#004F59', pick: () => this.setState({ i: k }), pickTop: () => { this.setState({ i: k }); const el = this.detailRef.current; if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 60, behavior: 'smooth' }); } })),
      a: { ...L, tel: 'tel:' + L.phone.replace(/[^0-9]/g, ''), dir: 'https://www.google.com/maps/dir/?api=1&destination=' + q, map: 'https://maps.google.com/maps?q=' + q + '&z=15&output=embed' },
      hours, status, statusBg: /Closed/.test(status) ? '#f1e3e0' : '#004F59', statusFg: /Closed/.test(status) ? '#8a3b2e' : '#fff',
    };
  }
}
</script>
</body>
