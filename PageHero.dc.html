<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<div style="height:100vh;min-height:520px"></div>
<section ref="{{ wrapRef }}" style="position:fixed;top:0;left:0;right:0;z-index:1;height:100vh;min-height:520px;padding:116px clamp(16px,4vw,40px) 28px">
  <div style="position:relative;height:100%;border-radius:36px;overflow:hidden;background:#004F59">
    <img ref="{{ imgRef }}" src="{{ img }}" alt="{{ alt }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform">
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,40,46,0) 35%,rgba(0,40,46,.82) 100%)"></div>
    <div style="position:absolute;left:clamp(24px,4vw,56px);right:clamp(24px,4vw,56px);bottom:clamp(24px,4vw,48px);display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap;color:#fff">
      <div style="display:flex;flex-direction:column;gap:14px;max-width:820px">
        <span style="font-family:Yellowtail,cursive;font-size:clamp(30px,3.4vw,46px);line-height:1;color:#C6AA76;text-shadow:0 1px 10px rgba(0,30,34,.55)">{{ caption }}</span>
        <h1 style="margin:0;font-family:'Titan One',sans-serif;font-weight:400;font-size:clamp(44px,min(7.5vw,11vh),116px);line-height:.9;text-transform:uppercase;text-shadow:5px 5px 0 #C6AA76">{{ t1 }}<br><span style="display:inline-block;padding-left:min(10vw,160px)">{{ t2 }}</span></h1>
      </div>
      <button type="button" aria-label="Scroll down" onClick="{{ down }}" style="width:52px;height:52px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer;transition:background .25s,color .25s" style-hover="background:#fff;color:#004F59">↓</button>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DoughBalls&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;caption&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;t1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;t2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  wrapRef = React.createRef(); imgRef = React.createRef();
  componentDidMount() {
    this.onScroll = () => {
      const sp = Math.min(1, window.scrollY / window.innerHeight), im = this.imgRef.current, w = this.wrapRef.current;
      if (im) im.style.transform = `translateY(${sp * 50}px) scale(${1 + sp * .1})`;
      if (w) w.style.visibility = window.scrollY > window.innerHeight * 2.2 ? 'hidden' : 'visible';
    };
    window.addEventListener('scroll', this.onScroll, { passive: true }); this.onScroll();
  }
  componentWillUnmount() { window.removeEventListener('scroll', this.onScroll); }
  renderVals() {
    return { wrapRef: this.wrapRef, imgRef: this.imgRef, down: () => window.scrollTo({ top: window.innerHeight * .75, behavior: 'smooth' }) };
  }
}
</script>
</body>
</html>
